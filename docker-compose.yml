version: '3.8'

services:
  twitter-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitter-scraper-api
    ports:
      - "3000:3000"
    volumes:
      - ./cookies:/app/cookies
      - ./data:/app/data
    environment:
      # Database connection
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: twitter_scraper
      
      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Twitter Credentials (set these in a .env file or pass directly)
      # TWITTER_USERNAME: ${TWITTER_USERNAME}
      # TWITTER_PASSWORD: ${TWITTER_PASSWORD}
      # TWITTER_EMAIL: ${TWITTER_EMAIL}
      
      # Twitter Scraper Settings (adjust as needed)
      MAX_TWEETS: 50000
      MAX_RETRIES: 5
      RETRY_DELAY: 5000
      MIN_DELAY: 1000
      MAX_DELAY: 3000
      RATE_LIMIT_THRESHOLD: 3
      
      # Timeout Settings (adjust as needed)
      COLLECTION_GLOBAL_TIMEOUT: 60000     # 60 seconds
      COLLECTION_STALL_TIMEOUT: 15000      # 15 seconds
      COLLECTION_PROGRESS_CHECK: 2000      # 2 seconds
      JOB_STALL_TIMEOUT: 45000             # 45 seconds
      JOB_PROGRESS_CHECK: 5000             # 5 seconds
      
      # Rate Limit Settings (adjust as needed)
      RATE_LIMIT_BASE_DELAY: 60000         # 1 minute
      RATE_LIMIT_MAX_DELAY: 900000         # 15 minutes
      RATE_LIMIT_DURATION: 900000          # 15 minutes
      RATE_LIMIT_KEY_EXPIRY: 900           # 15 minutes
      
      # Redis Key Settings (adjust as needed)
      NON_RETRIABLE_KEY_EXPIRY: 86400      # 24 hours
      PROGRESS_KEY_EXPIRY: 3600            # 1 hour
      
      # Node.js settings
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/twitter/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7
    container_name: twitter-scraper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:14
    container_name: twitter-scraper-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: twitter_scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  postgres_data: 
